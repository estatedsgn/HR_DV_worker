services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_dv_worker
      POSTGRES_USER: hr_dv_worker
      POSTGRES_PASSWORD: hr_dv_worker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_dv_worker -d hr_dv_worker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
